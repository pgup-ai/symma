name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Checked, not auto-committed: repairing formatting from CI needs
      # contents: write and still cannot push to a fork's branch, so the
      # fix stays `npm run format` locally.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Before the build, so a fresh clone is what gets tested.
      - run: npm test
      - run: npm run verify:pack
